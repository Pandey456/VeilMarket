name: FDC Run

on:
  workflow_dispatch:

jobs:
  fdc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node fdc-run.js
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
