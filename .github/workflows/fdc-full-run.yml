name: FDC Run

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install viem

      - name: Run FDC
        run: node veilmarket-tee/fdc-run.js
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
